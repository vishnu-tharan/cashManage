name: Daily Automated Activity

on:
  schedule:
    # 9:30 AM UTC corresponds to 3:00 PM IST (Indian Standard Time)
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required so the action can push the commit back to the repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          echo "- Automated update on $(date)" >> daily_activity.md
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily_activity.md
          git commit -m "Automated daily activity update"
          git push
